name: Release & Supply Chain Security

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or version override for manual dispatch (optional)'
        required: false
        type: string
  workflow_call:
    inputs:
      tag_name:
        description: 'Release tag emitted by caller'
        required: false
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    name: Build & Package Binaries, SBOMs & Cosign Signatures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Install Cosign (Sigstore)
        uses: sigstore/cosign-installer@v3.8.1

      - name: Install Syft (Anchore)
        uses: anchore/sbom-action/download-syft@v0.18.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6.2.1
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-and-sign-containers:
    name: Build, Sign & Attest Containers (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ov-server
            dockerfile: build/package/Dockerfile.server
          - name: ov-worker
            dockerfile: build/package/Dockerfile.worker
          - name: ov-web
            dockerfile: build/package/Dockerfile.web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Tag
        id: release_meta
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${TAG}"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign (Sigstore)
        uses: sigstore/cosign-installer@v3.8.1

      - name: Install Syft (Anchore)
        uses: anchore/sbom-action/download-syft@v0.18.0

      - name: Build and Push Multi-Arch Container Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ steps.release_meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest

      - name: Sign Container Digest with Cosign Keyless
        run: |
          IMAGE_URI="ghcr.io/${{ github.repository }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}"
          echo "Signing image digest: ${IMAGE_URI}"
          cosign sign --yes "${IMAGE_URI}"

      - name: Generate and Attest Container SBOM
        run: |
          IMAGE_URI="ghcr.io/${{ github.repository }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}"
          SBOM_FILE="sbom-${{ matrix.name }}.spdx.json"
          echo "Generating SPDX JSON SBOM for ${IMAGE_URI}..."
          syft "${IMAGE_URI}" -o spdx-json="${SBOM_FILE}"
          echo "Attesting SBOM with Cosign..."
          cosign attest --yes --predicate "${SBOM_FILE}" --type https://spdx.dev/Document "${IMAGE_URI}"

      - name: Attest Build Provenance (SLSA Level 3)
        uses: actions/attest-build-provenance@v2
        continue-on-error: true # Non-Enterprise user-owned private repos do not support provenance attestations; continue to ensure SBOM upload succeeds
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Upload Container SBOM to GitHub Release
        run: |
          TAG="${{ steps.release_meta.outputs.tag }}"
          SBOM_FILE="sbom-${{ matrix.name }}.spdx.json"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${SBOM_FILE}" --clobber
          else
            echo "Release ${TAG} not yet published on GitHub or not visible in current token scope; skipping asset upload."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
