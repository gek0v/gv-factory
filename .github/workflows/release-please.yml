name: Release Please & Distribution

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release-please:
    name: Release Please (Automated Semantic Release)
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@7987652d64c45816db5417d5456f086bce266e32 # v4.1.3
        id: release
        with:
          release-type: go
          package-name: ov-factory

  goreleaser:
    name: Build & Publish Multi-Platform Binaries
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@3041bf56c941b39ced0ddda70fa4a34d133b3a0b # v5.2.0
        with:
          go-version: '1.24'
          check-latest: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@90a31878c25440887b473f886cb45a15d6bda608 # v6.2.1
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-and-sign-containers:
    name: Container Build & Cosign Signing
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Cosign (Sigstore)
        uses: sigstore/cosign-installer@d7d6bc7722e3ea1f7318ac7328647844b80e1265 # v3.8.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@b5ca514310ca8bb2cc1cc1878e30d788885e400a # v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Container Images
        id: docker_build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ./deployments/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/ov-server:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/${{ github.repository }}/ov-server:latest

      - name: Sign Container Image with Cosign
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/ov-server:${{ needs.release-please.outputs.tag_name }}
