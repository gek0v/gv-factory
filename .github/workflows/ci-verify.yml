name: CI Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse-compliance:
    name: REUSE Compliance Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate REUSE specification
        uses: fsfe/reuse-action@514d69512c85b1a265e1286b7fa22485e9fa5a90 # v5.0.0

  lint-and-test-backend:
    name: Go Backend (Lint & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go environment
        uses: actions/setup-go@3041bf56c941b39ced0ddda70fa4a34d133b3a0b # v5.2.0
        with:
          go-version: '1.24'
          check-latest: true
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@2226f7cb6f94fad93e0d44fbf6732f77a1a1604b # v6.0.0
        with:
          version: v1.64.5
          args: --timeout=5m
        continue-on-error: true

      - name: Run Go Test Suite with Coverage
        run: |
          if [ -f "go.mod" ]; then
            go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          else
            echo "go.mod no inicializado todavía. Omitiendo pruebas unitarias de Go."
          fi

  lint-and-test-frontend:
    name: Frontend SPA (Lint & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d792dbb4137bef74010 # v3.0.0
        with:
          version: 9

      - name: Lint and Test Frontend
        run: |
          if [ -d "web" ] && [ -f "web/package.json" ]; then
            cd web
            pnpm install --frozen-lockfile
            pnpm run lint || true
            pnpm test || true
          else
            echo "Directorio web/ sin package.json. Omitiendo verificación de frontend."
          fi
