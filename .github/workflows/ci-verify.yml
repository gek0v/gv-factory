name: CI Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse-compliance:
    name: REUSE Compliance Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate REUSE specification
        uses: fsfe/reuse-action@bb774aa972c2a89ff34781233d275075cbddf542 # v5.0.0

  lint-and-test-backend:
    name: Go Backend (Lint & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go environment
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.24'
          check-latest: true
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@23faadfdeb23a6f9e511beaba149bb123b5b145a # v6.0.0
        with:
          version: v1.64.5
          args: --timeout=5m
        continue-on-error: true

      - name: Run Go Test Suite with Coverage
        run: |
          if [ -f "go.mod" ]; then
            go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          else
            echo "go.mod no inicializado todavía. Omitiendo pruebas unitarias de Go."
          fi

  lint-and-test-frontend:
    name: Frontend SPA (Lint & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - name: Lint and Test Frontend
        run: |
          if [ -d "web" ] && [ -f "web/package.json" ]; then
            cd web
            pnpm install --frozen-lockfile
            pnpm run lint || true
            pnpm test || true
          else
            echo "Directorio web/ sin package.json. Omitiendo verificación de frontend."
          fi
