version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ov-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ov_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ov_password}
      POSTGRES_DB: ${POSTGRES_DB:-ov_factory}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../migrations/brain/000001_init_pgvector.up.sql:/docker-entrypoint-initdb.d/000001_init_pgvector.up.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ov_user} -d ${POSTGRES_DB:-ov_factory}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  nats:
    image: nats:2.10-alpine
    container_name: ov-nats
    restart: unless-stopped
    command: ["-js", "-m", "8222", "-sd", "/data"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  hatchet:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-engine:latest
    container_name: ov-hatchet
    restart: unless-stopped
    environment:
      SERVER_ENCRYPTION_JWT_SECRET: ${HATCHET_JWT_SECRET:-devjwtsecretdevjwtsecretdevjwtsecret}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ov_user}:${POSTGRES_PASSWORD:-ov_password}@postgres:5432/${POSTGRES_DB:-ov_factory}
    ports:
      - "${HATCHET_PORT:-7077}:7077"
    depends_on:
      postgres:
        condition: service_healthy

  svix:
    image: svix/svix-server:latest
    container_name: ov-svix
    restart: unless-stopped
    environment:
      SVIX_DB_OPTIONS: postgres://${POSTGRES_USER:-ov_user}:${POSTGRES_PASSWORD:-ov_password}@postgres:5432/${POSTGRES_DB:-ov_factory}
      SVIX_JWT_SECRET: ${SVIX_JWT_SECRET:-devsvixsecretdevsvixsecret}
    ports:
      - "${SVIX_PORT:-8071}:8071"
    depends_on:
      postgres:
        condition: service_healthy

  ov-server:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.server
    image: gv-factory/ov-server:latest
    container_name: ov-server
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-ov_user}:${POSTGRES_PASSWORD:-ov_password}@postgres:5432/${POSTGRES_DB:-ov_factory}?sslmode=disable
      NATS_URL: nats://nats:4222
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-factory-default-secret-key-change-in-production}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-dev_github_secret}
      GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET:-dev_gitlab_secret}
      SENTRY_WEBHOOK_SECRET: ${SENTRY_WEBHOOK_SECRET:-dev_sentry_secret}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_DEFAULT_CHANNEL: ${SLACK_DEFAULT_CHANNEL:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      DISCORD_DEFAULT_CHANNEL: ${DISCORD_DEFAULT_CHANNEL:-}
      # LLM Provider Configuration (OpenAI, Anthropic, Ollama, vLLM, OpenRouter)
      PROVIDER: ${PROVIDER:-auto}
      MODEL: ${MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      # Pi / Pi-Bolt Harness Configuration
      PI_HARNESS_ENABLED: ${PI_HARNESS_ENABLED:-true}
    volumes:
      - sandboxes:/tmp/ov-sandboxes
      - ../.agents:/home/nonroot/.agents:ro
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  ov-worker:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.worker
    image: gv-factory/ov-worker:latest
    container_name: ov-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ov_user}:${POSTGRES_PASSWORD:-ov_password}@postgres:5432/${POSTGRES_DB:-ov_factory}?sslmode=disable
      NATS_URL: nats://nats:4222
      OV_WORKTREE_DIR: /tmp/ov-sandboxes
      HEALTH_PORT: "8081"
    ports:
      - "${WORKER_HEALTH_PORT:-8081}:8081"
    volumes:
      - sandboxes:/tmp/ov-sandboxes
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      ov-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    image: gv-factory/ov-web:latest
    container_name: ov-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:8080"
    depends_on:
      ov-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
  natsdata:
  sandboxes:
