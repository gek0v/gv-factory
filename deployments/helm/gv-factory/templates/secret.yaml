{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gv-factory.secretName" . }}
  labels:
    {{- include "gv-factory.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  AUTH_SECRET_KEY: {{ .Values.secret.authSecretKey | quote }}
  GITHUB_WEBHOOK_SECRET: {{ .Values.secret.githubWebhookSecret | quote }}
  GITLAB_WEBHOOK_SECRET: {{ .Values.secret.gitlabWebhookSecret | quote }}
  SENTRY_WEBHOOK_SECRET: {{ .Values.secret.sentryWebhookSecret | quote }}
  SLACK_BOT_TOKEN: {{ .Values.secret.slackBotToken | quote }}
  SLACK_SIGNING_SECRET: {{ .Values.secret.slackSigningSecret | quote }}
  DISCORD_BOT_TOKEN: {{ .Values.secret.discordBotToken | quote }}
  DISCORD_PUBLIC_KEY: {{ .Values.secret.discordPublicKey | quote }}
  # LLM API Secrets
  OPENAI_API_KEY: {{ .Values.llm.openai.apiKey | quote }}
  {{- if .Values.llm.vllm.apiKey }}
  OPENAI_COMPATIBLE_API_KEY: {{ .Values.llm.vllm.apiKey | quote }}
  {{- else if .Values.llm.openaiCompatible.apiKey }}
  OPENAI_COMPATIBLE_API_KEY: {{ .Values.llm.openaiCompatible.apiKey | quote }}
  {{- else }}
  OPENAI_COMPATIBLE_API_KEY: ""
  {{- end }}
  ANTHROPIC_API_KEY: {{ .Values.llm.anthropic.apiKey | quote }}
{{- end }}
