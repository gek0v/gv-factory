{{- if .Values.server.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gv-factory.server.fullname" . }}
  labels:
    {{- include "gv-factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.server.service.type }}
  ports:
    - port: {{ .Values.server.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "gv-factory.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
{{- end }}
{{- if .Values.worker.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gv-factory.worker.fullname" . }}
  labels:
    {{- include "gv-factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: {{ .Values.worker.service.type }}
  ports:
    - port: {{ .Values.worker.service.port }}
      targetPort: health
      protocol: TCP
      name: health
  selector:
    {{- include "gv-factory.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
{{- end }}
{{- if and .Values.postgres.enabled (not .Values.postgres.external.enabled) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gv-factory.postgres.fullname" . }}
  labels:
    {{- include "gv-factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: {{ .Values.postgres.service.type }}
  ports:
    - port: {{ .Values.postgres.service.port }}
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "gv-factory.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
{{- end }}
{{- if and .Values.nats.enabled (not .Values.nats.external.enabled) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gv-factory.nats.fullname" . }}
  labels:
    {{- include "gv-factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  type: {{ .Values.nats.service.type }}
  ports:
    - port: {{ .Values.nats.service.clientPort }}
      targetPort: client
      protocol: TCP
      name: client
    - port: {{ .Values.nats.service.monitorPort }}
      targetPort: monitor
      protocol: TCP
      name: monitor
  selector:
    {{- include "gv-factory.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nats
{{- end }}
