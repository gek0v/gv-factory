{{- if .Values.ingress.enabled }}
{{- $fullName := include "gv-factory.fullname" . }}
{{- $serverName := include "gv-factory.server.fullname" . }}
{{- $webName := include "gv-factory.web.fullname" . }}
{{- $serverPort := .Values.server.service.port }}
{{- $webPort := .Values.web.service.port }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "gv-factory.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ if eq .service "server" }}{{ $serverName }}{{ else }}{{ $webName }}{{ end }}
                port:
                  number: {{ if eq .service "server" }}{{ $serverPort }}{{ else }}{{ $webPort }}{{ end }}
          {{- end }}
    {{- end }}
{{- end }}
