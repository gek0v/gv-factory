{{- if and .Values.nats.enabled (not .Values.nats.external.enabled) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ov-factory.fullname" . }}-nats
  labels:
    {{- include "ov-factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.nats.service.clientPort }}
      targetPort: client
      protocol: TCP
      name: client
    - port: {{ .Values.nats.service.monitorPort }}
      targetPort: monitor
      protocol: TCP
      name: monitor
  selector:
    {{- include "ov-factory.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nats
{{- end }}
